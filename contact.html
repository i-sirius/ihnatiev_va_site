  <script>
    (function () {
      var root = document.documentElement;
      var forceLegacy = /(?:^|[?&])debug=legacy(?:[=&]|$)/.test(window.location.search);
      var supportsModernEffects =
        window.CSS &&
        typeof window.CSS.supports === "function" &&
        window.CSS.supports("color", "color-mix(in srgb, #000 50%, #fff)") &&
        window.CSS.supports("width", "min(20px, 40px)") &&
        window.CSS.supports("font-size", "clamp(1rem, 2vw, 2rem)");

      if (forceLegacy || !supportsModernEffects) {
        root.className += (root.className ? " " : "") + "legacy-browser no-modern-effects";
      }

      try {
        var savedTheme = localStorage.getItem("site-theme");
        var savedLocale = localStorage.getItem("site-locale");
        if (savedTheme) {
          root.setAttribute("data-theme", savedTheme);
        }
        if (savedLocale) {
          root.lang = savedLocale;
        }
      } catch (error) {
        // Ignore storage access issues before the app boots.
      }
    }());
  </script>

  <meta name="description" content="Контакти Віталія Ігнатьєва: форма повідомлення та профільні посилання." />
  <meta property="og:title" content="Контакти | Віталій Ігнатьєв" />
  <meta property="og:description" content="Форма повідомлення та профільні посилання Віталія Ігнатьєва." />

  <meta name="twitter:title" content="Контакти | Віталій Ігнатьєв" />
  <meta name="twitter:description" content="Форма повідомлення та профільні посилання Віталія Ігнатьєва." />
  <meta name="twitter:image" content="https://iva.net.ua/files/media/logo-light.png" />
</head>
<body data-page="contact">
  <header class="site-header">
    <h1 data-contact-title>Контакти</h1>
    <div id="menu"></div>
  </header>

  <main>
    <section class="panel">
      <h2 data-contact-heading>Контакти</h2>
      <section class="contact-socials" aria-labelledby="contact-socials-title">
        <h3 id="contact-socials-title" data-contact-socials-title>Мої соціальні мережі:</h3>
        <div class="contact-socials-list" data-contact-socials-list></div>
      </section>

      <div class="contact-form-divider" aria-hidden="true"></div>

      <p class="contact-form-intro" data-contact-intro>
        На цій сторінці розміщено контактну інформацію та форму для зв’язку. Якщо форма не завантажилася, спробуйте перезавантажити сторінку.
      </p>

      <form action="https://formspree.io/f/xnjlkjrp" method="POST" data-contact-form>
        <input type="hidden" name="_subject" value="Нове повідомлення із сайту" />

        <label>
          <span class="field-label">
            <span class="field-title">
              <span data-contact-name-label>Ім'я</span>
              <span class="required-mark" aria-hidden="true">*</span>
            </span>
          </span>
          <input name="name" maxlength="80" required />
          <small class="field-note" data-note-name>Обов'язково для заповнення</small>
          <small class="field-ok" data-ok-name hidden>✓ Заповнено</small>
        </label>

        <div class="contact-split">
          <label>
            <span class="field-label">
              <span class="field-title">
                <span data-contact-email-label>Email</span>
                <span class="required-mark" aria-hidden="true" data-mark-email>*</span>
              </span>
            </span>
            <input name="email" type="text" autocomplete="email" inputmode="email" maxlength="120" />
            <small class="field-note" data-note-email>Обов'язково: email або телефон</small>
            <small class="field-ok" data-ok-email hidden>✓ Email вказано</small>
          </label>

          <span class="contact-split-separator" aria-hidden="true">/</span>

          <label>
            <span class="field-label">
              <span class="field-title">
                <span data-contact-phone-label>Телефон</span>
                <span class="required-mark" aria-hidden="true" data-mark-phone>*</span>
              </span>
            </span>
            <input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="25" />
            <small class="field-note" data-note-phone>Обов'язково: телефон або email</small>
            <small class="field-ok" data-ok-phone hidden>✓ Телефон вказано</small>
          </label>
        </div>

        <label>
          <span class="field-label">
            <span class="field-title">
              <span data-contact-subject-label>Тема</span>
              <span class="required-mark" aria-hidden="true">*</span>
            </span>
          </span>
          <input name="subject" maxlength="140" required />
          <small class="field-note" data-note-subject>Обов'язково для заповнення</small>
          <small class="field-ok" data-ok-subject hidden>✓ Заповнено</small>
        </label>

        <label>
          <span class="field-label">
            <span class="field-title">
              <span data-contact-message-label>Повідомлення</span>
              <span class="required-mark" aria-hidden="true">*</span>
            </span>
          </span>
          <div class="textarea-meta">
            <small class="field-note" data-contact-message-note>
              Обов'язково для заповнення (не менше 25 символів)
            </small>
            <small class="field-ok" data-ok-message hidden>✓ Достатньо символів</small>
            <small class="contact-counter" data-contact-message-count hidden></small>
          </div>
          <textarea name="message" rows="4" minlength="25" maxlength="3000" required></textarea>
        </label>

        <button type="submit" data-contact-submit disabled>Надіслати</button>
      </form>
    </section>
  </main>

  <footer>
    <small data-footer>© 2026 Віталій Ігнатьєв</small>
  </footer>
