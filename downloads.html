    (function () {
      var root = document.documentElement;
      var forceLegacy = /(?:^|[?&])debug=legacy(?:[=&]|$)/.test(window.location.search);
      var supportsModernEffects =
        window.CSS &&
        typeof window.CSS.supports === "function" &&
        window.CSS.supports("color", "color-mix(in srgb, #000 50%, #fff)") &&
        window.CSS.supports("width", "min(20px, 40px)") &&
        window.CSS.supports("font-size", "clamp(1rem, 2vw, 2rem)");

      if (forceLegacy || !supportsModernEffects) {
        root.className += (root.className ? " " : "") + "legacy-browser no-modern-effects";
      }

      try {
        var savedTheme = localStorage.getItem("site-theme");
        var savedLocale = localStorage.getItem("site-locale");
        if (savedTheme) {
          root.setAttribute("data-theme", savedTheme);
        }
        if (savedLocale) {
          root.lang = savedLocale;
        }
      } catch (error) {
        // Ignore storage access issues before the app boots.
      }
    }());
  </script>
