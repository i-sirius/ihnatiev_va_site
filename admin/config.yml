backend:
  name: github
  repo: i-sirius/ihnatiev_va_site
  branch: main
  site_domain: iva.net.ua
  base_url: https://decap.iva.net.ua
  auth_endpoint: /auth

# Enables local CMS testing with the Decap local proxy.
local_backend: true

publish_mode: editorial_workflow
media_folder: files/media/uploads
public_folder: files/media/uploads

collections:
  - name: home_content
    label: "Головна сторінка"
    files:
      - name: home
        label: "Тексти головної сторінки"
        file: files/content/home.json
        format: json
        fields:
          - label: "Українська"
            name: uk
            widget: object
            fields:
              - { label: "Заголовок блоку про автора", name: aboutHeading, widget: string }
              - label: "Фото автора"
                name: aboutImage
                widget: object
                fields:
                  - { label: "Опис для доступності", name: alt, widget: string }
              - label: "Абзаци про автора"
                name: aboutParagraphs
                widget: list
                field: { label: "Абзац", name: paragraph, widget: text }
              - { label: "Заголовок блоку діяльності", name: activitiesHeading, widget: string }
          - label: "English"
            name: en
            widget: object
            fields:
              - { label: "About block heading", name: aboutHeading, widget: string }
              - label: "Author photo"
                name: aboutImage
                widget: object
                fields:
                  - { label: "Accessible description", name: alt, widget: string }
              - label: "About paragraphs"
                name: aboutParagraphs
                widget: list
                field: { label: "Paragraph", name: paragraph, widget: text }
              - { label: "Activities block heading", name: activitiesHeading, widget: string }

  - name: activities_content
    label: "Розділи діяльності"
    files:
      - name: activities
        label: "Назви та короткі описи"
        file: files/content/activities.json
        format: json
        fields:
          - label: "Українська"
            name: uk
            widget: object
            fields:
              - label: "Наукова активність"
                name: "1"
                widget: object
                fields:
                  - { label: "Назва", name: name, widget: string }
                  - { label: "Короткий опис картки", name: cardDescription, widget: text }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt-текст", name: alt, widget: string }
              - label: "Освітня діяльність"
                name: "2"
                widget: object
                fields:
                  - { label: "Назва", name: name, widget: string }
                  - { label: "Короткий опис картки", name: cardDescription, widget: text }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt-текст", name: alt, widget: string }
              - label: "Священнослужіння"
                name: "3"
                widget: object
                fields:
                  - { label: "Назва", name: name, widget: string }
                  - { label: "Короткий опис картки", name: cardDescription, widget: text }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt-текст", name: alt, widget: string }
          - label: "English"
            name: en
            widget: object
            fields:
              - label: "Research Activity"
                name: "1"
                widget: object
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Short card description", name: cardDescription, widget: text }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt text", name: alt, widget: string }
              - label: "Educational Activity"
                name: "2"
                widget: object
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Short card description", name: cardDescription, widget: text }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt text", name: alt, widget: string }
              - label: "Priestly Ministry"
                name: "3"
                widget: object
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Short card description", name: cardDescription, widget: text }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt text", name: alt, widget: string }

  - name: pages_content
    label: "Сторінки"
    files:
      - name: pages
        label: "Завантаження і контакти"
        file: files/content/pages.json
        format: json
        fields:
          - label: "Українська"
            name: uk
            widget: object
            fields:
              - label: "Завантаження"
                name: downloads
                widget: object
                fields:
                  - { label: "Title", name: pageTitle, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text, required: false }
              - label: "Контакти"
                name: contact
                widget: object
                fields:
                  - { label: "Title", name: pageTitle, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "Соціальні мережі"
                    name: socials
                    widget: object
                    fields:
                      - { label: "Заголовок", name: title, widget: string }
                  - label: "Поля форми"
                    name: fields
                    widget: object
                    fields:
                      - { label: "Ім'я", name: name, widget: string }
                      - { label: "Email", name: email, widget: string }
                      - { label: "Телефон", name: phone, widget: string }
                      - { label: "Тема", name: subject, widget: string }
                      - { label: "Повідомлення", name: message, widget: string }
                      - { label: "Submit", name: submit, widget: string }
                  - { label: "Тема листа Formspree", name: formSubject, widget: string }
          - label: "English"
            name: en
            widget: object
            fields:
              - label: "Downloads"
                name: downloads
                widget: object
                fields:
                  - { label: "Title", name: pageTitle, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text, required: false }
              - label: "Contacts"
                name: contact
                widget: object
                fields:
                  - { label: "Title", name: pageTitle, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "Social links"
                    name: socials
                    widget: object
                    fields:
                      - { label: "Heading", name: title, widget: string }
                  - label: "Form fields"
                    name: fields
                    widget: object
                    fields:
                      - { label: "Name", name: name, widget: string }
                      - { label: "Email", name: email, widget: string }
                      - { label: "Phone", name: phone, widget: string }
                      - { label: "Subject", name: subject, widget: string }
                      - { label: "Message", name: message, widget: string }
                      - { label: "Submit", name: submit, widget: string }
                  - { label: "Formspree email subject", name: formSubject, widget: string }

  - name: publications_content
    label: "Наукові праці"
    files:
      - name: publications
        label: "Список наукових праць"
        file: files/content/publications.json
        format: json
        fields:
          - label: "Українська"
            name: uk
            widget: object
            fields:
              - { label: "Заголовок списку", name: summary, widget: string }
              - { label: "Опис списку", name: description, widget: string }
              - { label: "Label: пошук", name: searchLabel, widget: string }
              - { label: "Placeholder пошуку", name: searchPlaceholder, widget: string }
              - { label: "Label: рік", name: yearLabel, widget: string }
              - { label: "Label: тип", name: typeLabel, widget: string }
              - { label: "Усі роки", name: allYearsLabel, widget: string }
              - { label: "Усі типи", name: allTypesLabel, widget: string }
              - { label: "Порожній результат", name: emptyLabel, widget: string }
              - label: "Назви типів"
                name: typeLabels
                widget: object
                fields:
                  - { label: "Стаття", name: article, widget: string }
                  - { label: "Конференція", name: conference, widget: string }
                  - { label: "Монографія", name: monograph, widget: string }
                  - { label: "Навчальні матеріали", name: teaching, widget: string }
                  - { label: "Інше", name: other, widget: string }
          - label: "English"
            name: en
            widget: object
            fields:
              - { label: "List heading", name: summary, widget: string }
              - { label: "List description", name: description, widget: string }
              - { label: "Search label", name: searchLabel, widget: string }
              - { label: "Search placeholder", name: searchPlaceholder, widget: string }
              - { label: "Year label", name: yearLabel, widget: string }
              - { label: "Type label", name: typeLabel, widget: string }
              - { label: "All years", name: allYearsLabel, widget: string }
              - { label: "All types", name: allTypesLabel, widget: string }
              - { label: "Empty result", name: emptyLabel, widget: string }
              - label: "Type labels"
                name: typeLabels
                widget: object
                fields:
                  - { label: "Article", name: article, widget: string }
                  - { label: "Conference", name: conference, widget: string }
                  - { label: "Monograph", name: monograph, widget: string }
                  - { label: "Teaching materials", name: teaching, widget: string }
                  - { label: "Other", name: other, widget: string }
          - label: "Публікації"
            name: items
            widget: list
            summary: "{{fields.year}} · {{fields.type}} · {{fields.text}}"
            fields:
              - { label: "Текст", name: text, widget: text }
              - { label: "Рік", name: year, widget: number, value_type: int, min: 1900, max: 2100, required: false }
              - label: "Тип"
                name: type
                widget: select
                default: other
                options:
                  - { label: "Стаття", value: article }
                  - { label: "Конференція", value: conference }
                  - { label: "Монографія", value: monograph }
                  - { label: "Навчальні матеріали", value: teaching }
                  - { label: "Інше", value: other }

  - name: gallery_activity1
    label: "Галерея: Наукова активність"
    media_folder: files/media/activity1
    public_folder: files/media/activity1
    files:
      - name: photos
        label: "Фото"
        file: files/media/activity1/photos.json
        format: json
        fields:
          - label: "Фото"
            name: images
            widget: list
            summary: "{{fields.src}}"
            fields:
              - { label: "Зображення", name: src, widget: image }
              - { label: "Опис для доступності", name: alt, widget: string, required: false }

  - name: gallery_activity2
    label: "Галерея: Освітня діяльність"
    media_folder: files/media/activity2
    public_folder: files/media/activity2
    files:
      - name: photos
        label: "Фото"
        file: files/media/activity2/photos.json
        format: json
        fields:
          - label: "Фото"
            name: images
            widget: list
            summary: "{{fields.src}}"
            fields:
              - { label: "Зображення", name: src, widget: image }
              - { label: "Опис для доступності", name: alt, widget: string, required: false }

  - name: gallery_activity3
    label: "Галерея: Священнослужіння"
    media_folder: files/media/activity3
    public_folder: files/media/activity3
    files:
      - name: photos
        label: "Фото"
        file: files/media/activity3/photos.json
        format: json
        fields:
          - label: "Фото"
            name: images
            widget: list
            summary: "{{fields.src}}"
            fields:
              - { label: "Зображення", name: src, widget: image }
              - { label: "Опис для доступності", name: alt, widget: string, required: false }

  - name: activity2_files
    label: "Файли: Освітня діяльність"
    media_folder: files/activity2
    public_folder: files/activity2
    files:
      - name: files
        label: "Файли"
        file: files/activity2/files.json
        format: json
        fields:
          - label: "Файли"
            name: files
            widget: list
            summary: "{{fields.href}}"
            fields:
              - { label: "Файл", name: href, widget: file }
              - label: "Назва"
                name: label
                widget: object
                fields:
                  - { label: "Українською", name: uk, widget: string }
                  - { label: "English", name: en, widget: string, required: false }

  - name: downloads
    label: "Завантаження"
    media_folder: files/downloads
    public_folder: files/downloads
    files:
      - name: files
        label: "Матеріали для завантаження"
        file: files/downloads/files.json
        format: json
        fields:
          - label: "Монографії"
            name: monographs
            widget: list
            summary: "{{fields.href}}"
            fields:
              - { label: "Файл", name: href, widget: file, required: false }
              - label: "Назва"
                name: label
                widget: object
                fields:
                  - { label: "Українською", name: uk, widget: string }
                  - { label: "English", name: en, widget: string, required: false }
              - label: "Кнопка запиту книги"
                name: purchase
                widget: object
                required: false
                fields:
                  - { label: "Режим", name: mode, widget: string, default: contact }
                  - label: "Текст кнопки"
                    name: label
                    widget: object
                    required: false
                    fields:
                      - { label: "Українською", name: uk, widget: string, required: false }
                      - { label: "English", name: en, widget: string, required: false }
                  - label: "Тема листа"
                    name: subject
                    widget: object
                    required: false
                    fields:
                      - { label: "Українською", name: uk, widget: string, required: false }
                      - { label: "English", name: en, widget: string, required: false }
                  - label: "Текст листа"
                    name: message
                    widget: object
                    required: false
                    fields:
                      - { label: "Українською", name: uk, widget: text, required: false }
                      - { label: "English", name: en, widget: text, required: false }

          - label: "Статті"
            name: articles
            widget: list
            summary: "{{fields.title.uk}}"
            fields:
              - label: "Назва групи"
                name: title
                widget: object
                fields:
                  - { label: "Українською", name: uk, widget: string }
                  - { label: "English", name: en, widget: string, required: false }
              - label: "Файли"
                name: files
                widget: list
                summary: "{{fields.href}}"
                fields:
                  - { label: "Файл", name: href, widget: file }
                  - label: "Назва"
                    name: label
                    widget: object
                    fields:
                      - { label: "Українською", name: uk, widget: string }
                      - { label: "English", name: en, widget: string, required: false }
