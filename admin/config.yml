backend:
  name: github
  repo: i-sirius/ihnatiev_va_site
  branch: main
  site_domain: iva.net.ua
  base_url: https://decap.iva.net.ua
  auth_endpoint: /auth

# Enables local CMS testing with the Decap local proxy.
local_backend: true

publish_mode: editorial_workflow
media_folder: files/media/uploads
public_folder: /files/media/uploads

collections:
  - name: home_content
    label: "Головна сторінка"
    description: "Короткі тексти головної сторінки. Довгі біографічні блоки краще змінювати обережно."
    files:
      - name: home
        label: "Тексти головної сторінки"
        file: files/content/home.json
        format: json
        fields:
          - label: "Українська"
            name: uk
            widget: object
            fields:
              - { label: "Заголовок блоку про автора", name: aboutHeading, widget: string }
              - label: "Фото автора"
                name: aboutImage
                widget: object
                fields:
                  - { label: "Опис для доступності", name: alt, widget: string }
              - label: "Абзаци про автора"
                name: aboutParagraphs
                widget: list
                collapsed: true
                summary: "{{fields.paragraph}}"
                hint: "Один абзац = один пункт списку. HTML тут не потрібен."
                field: { label: "Абзац", name: paragraph, widget: text }
              - { label: "Заголовок блоку діяльності", name: activitiesHeading, widget: string }
          - label: "English"
            name: en
            widget: object
            fields:
              - { label: "About block heading", name: aboutHeading, widget: string }
              - label: "Author photo"
                name: aboutImage
                widget: object
                fields:
                  - { label: "Accessible description", name: alt, widget: string }
              - label: "About paragraphs"
                name: aboutParagraphs
                widget: list
                collapsed: true
                summary: "{{fields.paragraph}}"
                hint: "One paragraph per item. HTML is not needed here."
                field: { label: "Paragraph", name: paragraph, widget: text }
              - { label: "Activities block heading", name: activitiesHeading, widget: string }

  - name: activities_content
    label: "Розділи діяльності"
    description: "Назви, короткі описи карток і alt-тексти hero-зображень. Повні тексти сторінок тут не редагуються."
    files:
      - name: activities
        label: "Назви та короткі описи"
        file: files/content/activities.json
        format: json
        fields:
          - label: "Українська"
            name: uk
            widget: object
            fields:
              - label: "Наукова активність"
                name: "1"
                widget: object
                fields:
                  - { label: "Назва", name: name, widget: string }
                  - { label: "Короткий опис картки", name: cardDescription, widget: text, hint: "Короткий текст для картки на головній сторінці." }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt-текст", name: alt, widget: string, hint: "Опис зображення для доступності, без HTML." }
              - label: "Освітня діяльність"
                name: "2"
                widget: object
                fields:
                  - { label: "Назва", name: name, widget: string }
                  - { label: "Короткий опис картки", name: cardDescription, widget: text, hint: "Короткий текст для картки на головній сторінці." }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt-текст", name: alt, widget: string, hint: "Опис зображення для доступності, без HTML." }
              - label: "Священнослужіння"
                name: "3"
                widget: object
                fields:
                  - { label: "Назва", name: name, widget: string }
                  - { label: "Короткий опис картки", name: cardDescription, widget: text, hint: "Короткий текст для картки на головній сторінці." }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt-текст", name: alt, widget: string, hint: "Опис зображення для доступності, без HTML." }
          - label: "English"
            name: en
            widget: object
            fields:
              - label: "Research Activity"
                name: "1"
                widget: object
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Short card description", name: cardDescription, widget: text, hint: "Short text for the home page card." }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt text", name: alt, widget: string, hint: "Accessible image description, no HTML." }
              - label: "Educational Activity"
                name: "2"
                widget: object
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Short card description", name: cardDescription, widget: text, hint: "Short text for the home page card." }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt text", name: alt, widget: string, hint: "Accessible image description, no HTML." }
              - label: "Priestly Ministry"
                name: "3"
                widget: object
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Short card description", name: cardDescription, widget: text, hint: "Short text for the home page card." }
                  - label: "Hero image"
                    name: heroImage
                    widget: object
                    fields:
                      - { label: "Alt text", name: alt, widget: string, hint: "Accessible image description, no HTML." }

  - name: pages_content
    label: "Сторінки"
    description: "Прості тексти сторінок Завантаження і Контакти. Соціальні URL редагуються окремо у Профільних посиланнях."
    files:
      - name: pages
        label: "Завантаження і контакти"
        file: files/content/pages.json
        format: json
        fields:
          - label: "Українська"
            name: uk
            widget: object
            fields:
              - label: "Завантаження"
                name: downloads
                widget: object
                fields:
                  - { label: "Title", name: pageTitle, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text, required: false, hint: "Можна залишити порожнім." }
              - label: "Контакти"
                name: contact
                widget: object
                fields:
                  - { label: "Title", name: pageTitle, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "Соціальні мережі"
                    name: socials
                    widget: object
                    fields:
                      - { label: "Заголовок", name: title, widget: string, hint: "Це тільки заголовок блоку. Самі URL редагуються в колекції Профільні посилання." }
                  - label: "Поля форми"
                    name: fields
                    widget: object
                    fields:
                      - { label: "Ім'я", name: name, widget: string }
                      - { label: "Email", name: email, widget: string }
                      - { label: "Телефон", name: phone, widget: string }
                      - { label: "Тема", name: subject, widget: string }
                      - { label: "Повідомлення", name: message, widget: string }
                      - { label: "Submit", name: submit, widget: string }
                  - { label: "Тема листа Formspree", name: formSubject, widget: string, hint: "Ця тема підставляється у приховане поле форми." }
          - label: "English"
            name: en
            widget: object
            fields:
              - label: "Downloads"
                name: downloads
                widget: object
                fields:
                  - { label: "Title", name: pageTitle, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text, required: false, hint: "Can be left empty." }
              - label: "Contacts"
                name: contact
                widget: object
                fields:
                  - { label: "Title", name: pageTitle, widget: string }
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Intro", name: intro, widget: text }
                  - label: "Social links"
                    name: socials
                    widget: object
                    fields:
                      - { label: "Heading", name: title, widget: string, hint: "This is only the block heading. URLs are edited in Profile links." }
                  - label: "Form fields"
                    name: fields
                    widget: object
                    fields:
                      - { label: "Name", name: name, widget: string }
                      - { label: "Email", name: email, widget: string }
                      - { label: "Phone", name: phone, widget: string }
                      - { label: "Subject", name: subject, widget: string }
                      - { label: "Message", name: message, widget: string }
                      - { label: "Submit", name: submit, widget: string }
                  - { label: "Formspree email subject", name: formSubject, widget: string, hint: "Used as the hidden email subject for the contact form." }

  - name: publications_content
    label: "Наукові праці"
    description: "Список праць і прості labels фільтрів. Рік має бути роком публікації, не частиною ISSN."
    media_folder: files/publications
    public_folder: /files/publications
    files:
      - name: publications
        label: "Список наукових праць"
        file: files/content/publications.json
        format: json
        fields:
          - label: "Українська"
            name: uk
            widget: object
            fields:
              - { label: "Заголовок списку", name: summary, widget: string }
              - { label: "Опис списку", name: description, widget: string }
              - { label: "Label: пошук", name: searchLabel, widget: string }
              - { label: "Placeholder пошуку", name: searchPlaceholder, widget: string }
              - { label: "Label: рік", name: yearLabel, widget: string }
              - { label: "Label: тип", name: typeLabel, widget: string }
              - { label: "Усі роки", name: allYearsLabel, widget: string }
              - { label: "Усі типи", name: allTypesLabel, widget: string }
              - { label: "Порожній результат", name: emptyLabel, widget: string }
              - label: "Назви типів"
                name: typeLabels
                widget: object
                fields:
                  - { label: "Стаття", name: article, widget: string }
                  - { label: "Конференція", name: conference, widget: string }
                  - { label: "Монографія", name: monograph, widget: string }
                  - { label: "Навчальні матеріали", name: teaching, widget: string }
                  - { label: "Інше", name: other, widget: string }
          - label: "English"
            name: en
            widget: object
            fields:
              - { label: "List heading", name: summary, widget: string }
              - { label: "List description", name: description, widget: string }
              - { label: "Search label", name: searchLabel, widget: string }
              - { label: "Search placeholder", name: searchPlaceholder, widget: string }
              - { label: "Year label", name: yearLabel, widget: string }
              - { label: "Type label", name: typeLabel, widget: string }
              - { label: "All years", name: allYearsLabel, widget: string }
              - { label: "All types", name: allTypesLabel, widget: string }
              - { label: "Empty result", name: emptyLabel, widget: string }
              - label: "Type labels"
                name: typeLabels
                widget: object
                fields:
                  - { label: "Article", name: article, widget: string }
                  - { label: "Conference", name: conference, widget: string }
                  - { label: "Monograph", name: monograph, widget: string }
                  - { label: "Teaching materials", name: teaching, widget: string }
                  - { label: "Other", name: other, widget: string }
          - label: "Публікації"
            name: items
            widget: list
            collapsed: true
            summary: "{{fields.year}} · {{fields.type}} · {{fields.text}}"
            fields:
              - { label: "Текст", name: text, widget: text, hint: "Повний бібліографічний опис одним текстовим полем." }
              - label: "Рік"
                name: year
                widget: string
                required: false
                hint: "Вкажіть 4 цифри року або залиште порожнім, якщо рік ще невідомий. Не копіюйте сюди цифри з ISSN/ISBN."
                pattern:
                  - "^$|^(19|20|21)\\d{2}$"
                  - "Рік має бути порожнім або складатися з 4 цифр."
              - label: "Тип"
                name: type
                widget: select
                default: other
                hint: "Тип використовується для фільтрації на сайті."
                options:
                  - { label: "Стаття", value: article }
                  - { label: "Конференція", value: conference }
                  - { label: "Монографія", value: monograph }
                  - { label: "Навчальні матеріали", value: teaching }
                  - { label: "Інше", value: other }
              - label: "Файл праці"
                name: file
                widget: file
                required: false
                choose_url: false
                hint: "Необов'язково. Додавайте файл тільки якщо є право публікувати його на сайті. Файли зберігаються в /files/publications/."

  - name: social_links
    label: "Профільні посилання"
    description: "URL-и для іконок шапки, контактної сторінки та профільних кнопок наукового розділу."
    files:
      - name: social_links
        label: "Посилання для шапки та контактів"
        file: files/content/social-links.json
        format: json
        fields:
          - label: "Посилання"
            name: links
            widget: list
            collapsed: true
            summary: "{{fields.id}} · {{fields.label.uk}}"
            hint: "Ці посилання використовуються в іконках шапки, на сторінці контактів і в профільних кнопках наукового розділу."
            fields:
              - label: "Тип посилання"
                name: id
                widget: select
                hint: "Не змінюйте тип без потреби: від нього залежить іконка."
                options:
                  - { label: "YouTube", value: youtube }
                  - { label: "Facebook", value: facebook }
                  - { label: "Telegram", value: telegram }
                  - { label: "Web of Science", value: webofscience }
                  - { label: "ORCID", value: orcid }
                  - { label: "Google Scholar", value: googlescholar }
              - label: "Назва"
                name: label
                widget: object
                hint: "Цей текст використовується для aria-label, title і підписів у контактах."
                fields:
                  - { label: "Українською", name: uk, widget: string }
                  - { label: "English", name: en, widget: string }
              - label: "URL"
                name: href
                widget: string
                required: false
                hint: "Для YouTube порожній URL автоматично бере channel ID із системного config.js."
                pattern:
                  - "^$|^https?://.+"
                  - "URL має бути порожнім або починатися з http:// чи https://"
              - { label: "Показувати", name: enabled, widget: boolean, default: true, hint: "Вимкнене посилання не показується на сайті, але залишається в JSON." }
              - { label: "Нотатка для редактора", name: description, widget: string, required: false }

  - name: gallery_activity1
    label: "Галерея: Наукова активність"
    description: "Зображення галереї на сторінці наукової активності."
    media_folder: files/media/activity1
    public_folder: /files/media/activity1
    files:
      - name: photos
        label: "Фото"
        file: files/media/activity1/photos.json
        format: json
        fields:
          - label: "Фото"
            name: images
            widget: list
            collapsed: true
            summary: "{{fields.src}}"
            hint: "У кнопках Decap: Choose different file = обрати/замінити фото; Remove file = прибрати фото з цього запису."
            fields:
              - label: "Зображення"
                name: src
                widget: image
                choose_url: false
                hint: "Оберіть або завантажте фото з медіатеки. Вставлення URL вимкнено, щоб зберігати локальний файл у репозиторії."
              - { label: "Опис для доступності", name: alt, widget: string, required: false }

  - name: gallery_activity2
    label: "Галерея: Освітня діяльність"
    description: "Зображення галереї на сторінці освітньої діяльності."
    media_folder: files/media/activity2
    public_folder: /files/media/activity2
    files:
      - name: photos
        label: "Фото"
        file: files/media/activity2/photos.json
        format: json
        fields:
          - label: "Фото"
            name: images
            widget: list
            collapsed: true
            summary: "{{fields.src}}"
            hint: "У кнопках Decap: Choose different file = обрати/замінити фото; Remove file = прибрати фото з цього запису."
            fields:
              - label: "Зображення"
                name: src
                widget: image
                choose_url: false
                hint: "Оберіть або завантажте фото з медіатеки. Вставлення URL вимкнено, щоб зберігати локальний файл у репозиторії."
              - { label: "Опис для доступності", name: alt, widget: string, required: false }

  - name: gallery_activity3
    label: "Галерея: Священнослужіння"
    description: "Зображення галереї на сторінці священнослужіння."
    media_folder: files/media/activity3
    public_folder: /files/media/activity3
    files:
      - name: photos
        label: "Фото"
        file: files/media/activity3/photos.json
        format: json
        fields:
          - label: "Фото"
            name: images
            widget: list
            collapsed: true
            summary: "{{fields.src}}"
            hint: "У кнопках Decap: Choose different file = обрати/замінити фото; Remove file = прибрати фото з цього запису."
            fields:
              - label: "Зображення"
                name: src
                widget: image
                choose_url: false
                hint: "Оберіть або завантажте фото з медіатеки. Вставлення URL вимкнено, щоб зберігати локальний файл у репозиторії."
              - { label: "Опис для доступності", name: alt, widget: string, required: false }

  - name: activity2_files
    label: "Файли: Освітня діяльність"
    description: "Файли, що показуються в розділі освітньої діяльності."
    media_folder: files/activity2
    public_folder: /files/activity2
    files:
      - name: files
        label: "Файли"
        file: files/activity2/files.json
        format: json
        fields:
          - label: "Файли"
            name: files
            widget: list
            collapsed: true
            summary: "{{fields.href}}"
            hint: "У кнопках Decap: Choose different file = обрати/замінити файл; Remove file = прибрати файл з цього запису."
            fields:
              - label: "Файл"
                name: href
                widget: file
                choose_url: false
                hint: "Оберіть або завантажте локальний файл. Вставлення URL вимкнено, щоб матеріали залишались у репозиторії."
              - label: "Назва"
                name: label
                widget: object
                fields:
                  - { label: "Українською", name: uk, widget: string }
                  - { label: "English", name: en, widget: string, required: false }

  - name: downloads
    label: "Завантаження"
    description: "Монографії та статті для сторінки Завантаження."
    media_folder: files/downloads
    public_folder: /files/downloads
    files:
      - name: files
        label: "Матеріали для завантаження"
        file: files/downloads/files.json
        format: json
        fields:
          - label: "Монографії"
            name: monographs
            widget: list
            collapsed: true
            summary: "{{fields.href}}"
            hint: "У кнопках Decap: Choose different file = обрати/замінити файл; Remove file = прибрати файл з цього запису."
            fields:
              - label: "Файл"
                name: href
                widget: file
                required: false
                choose_url: false
                hint: "Оберіть PDF/документ із медіатеки. Можна залишити порожнім, якщо замість файла показується кнопка запиту книги."
              - label: "Назва"
                name: label
                widget: object
                fields:
                  - { label: "Українською", name: uk, widget: string }
                  - { label: "English", name: en, widget: string, required: false }
              - label: "Кнопка запиту книги"
                name: purchase
                widget: object
                required: false
                fields:
                  - label: "Режим"
                    name: mode
                    widget: select
                    default: contact
                    hint: "Поки підтримується тільки contact: кнопка веде до форми контактів."
                    options:
                      - { label: "Запит через контакти", value: contact }
                  - label: "Текст кнопки"
                    name: label
                    widget: object
                    required: false
                    fields:
                      - { label: "Українською", name: uk, widget: string, required: false }
                      - { label: "English", name: en, widget: string, required: false }
                  - label: "Тема листа"
                    name: subject
                    widget: object
                    required: false
                    fields:
                      - { label: "Українською", name: uk, widget: string, required: false }
                      - { label: "English", name: en, widget: string, required: false }
                  - label: "Текст листа"
                    name: message
                    widget: object
                    required: false
                    fields:
                      - { label: "Українською", name: uk, widget: text, required: false }
                      - { label: "English", name: en, widget: text, required: false }

          - label: "Статті"
            name: articles
            widget: list
            collapsed: true
            summary: "{{fields.title.uk}}"
            fields:
              - label: "Назва групи"
                name: title
                widget: object
                fields:
                  - { label: "Українською", name: uk, widget: string }
                  - { label: "English", name: en, widget: string, required: false }
              - label: "Файли"
                name: files
                widget: list
                collapsed: true
                summary: "{{fields.href}}"
                hint: "У кнопках Decap: Choose different file = обрати/замінити файл; Remove file = прибрати файл з цього запису."
                fields:
                  - label: "Файл"
                    name: href
                    widget: file
                    choose_url: false
                    hint: "Оберіть або завантажте локальний файл. Вставлення URL вимкнено, щоб матеріали залишались у репозиторії."
                  - label: "Назва"
                    name: label
                    widget: object
                    fields:
                      - { label: "Українською", name: uk, widget: string }
                      - { label: "English", name: en, widget: string, required: false }
